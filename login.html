<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish List |TipToe Soles</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Top Header -->
    <header class="site-header">
        <div class="logo-container">
            <a href="index.html" title="TipToe Soles Home">
                <img src="images/TipToe Soles_Logo_colour.png" alt="TipToe Soles Brand Logo" class="site-logo">
            </a>
        </div>
        <div class="search-container">
            <form action="#" method="get" class="search-form" role="search">
                <label for="site-search" class="visually-hidden">Search products:</label>
                <input type="search" id="site-search" name="q" placeholder="Search products...">
                <button type="submit">Search</button>
            </form>
        </div>
    </header>

    <!-- Main Layout Container -->
    <div class="main-layout">
        <!-- Left Navigational Menu -->
        <nav class="side-navigation" aria-label="Main Navigation">
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About Us</a></li>
                <li><a href="products.html" class="nav-link">Products</a></li>
                <li><a href="services.html" class="nav-link">Services</a></li>
                <li><a href="contact.html" class="nav-link">Contact Us</a></li>
                <li><a href="login.html" class="nav-link active" aria-current="page">Login</a></li>
                <li><a href="wishlist.html" class="nav-link" >Wishlist</a></li>
                <li><a href="feedback.html" class="nav-link">Feedback</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="content-area-login">
            <section class="info-section">
                <h1>Login</h1><br><br>
                <form action="#" method="post" class="contact-form-login">
                    <div class="form-group">
                        <label for="fullname">Full Name | Username <span class="required">*</span></label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Password <span class="required">*</span></label>
                        <input type="password" id="subject" name="subject">
                    </div>

                    <button type="submit" class="submit-btn-login">LogIn</button>
            </section>
        </main>
    </div>

    <!-- Site Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-policies">
                <h4>Customer Policies</h4>
                <ul>
                    <li><a href="returnAndExchangePolicy.html" class="nav-link">Return Policy</a></li>
                    <li><a href="returnAndExchangePolicy.html" class="nav-link">Exchange Policy</a></li>
                    <li><a href="deliveryPolicy.html" class="nav-link">Delivery Policy</a></li>
                </ul>
            </div>
            <div class="footer-social">
                <h4>Connect With Us</h4>
                <ul>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">LinkedIn</a></li>

            </div>
